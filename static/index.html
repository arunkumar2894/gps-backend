<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live GPS Tracker Location</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
</head>
<body>

<div id="offline-banner">⚠️ Network connection lost. Reconnecting...</div>

<button id="drawer-toggle" class="btn drawer-toggle" onclick="toggleAppDrawer()" type="button" aria-label="Open or close vehicle details drawer" aria-expanded="true">
    <span class="hamburger" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
    </span>
</button>

<header>
    <h1>Live Location Viewer</h1>
    <div class="header-controls">
        <div class="auto-refresh-box">
            <label>
                <input type="checkbox" id="auto-refresh-toggle" onchange="toggleAutoRefresh()" checked> Auto
            </label>
            <select id="refresh-interval" onchange="changeInterval()">
                <option value="5">5s</option>
                <option value="10" selected>10s</option>
                <option value="30">30s</option>
                <option value="60">60s</option>
            </select>
            <span id="countdown-timer">(10s)</span>
        </div>
        <div class="status-box">
            <span class="status-label">Status:</span>
            <span class="pulse-dot" id="pulse-indicator"></span>
            <span class="status-badge" id="status">Live</span>
        </div>
        <button id="refresh-loc-btn" class="btn" onclick="fetchLocation()">Refresh Location</button>
    </div>
</header>

<div id="drawer-backdrop" class="drawer-backdrop" onclick="toggleAppDrawer(false)"></div>

<aside id="app-drawer" class="app-drawer" aria-label="Vehicle details drawer">
    <div class="drawer-header">
        <h2>Vehicle Details</h2>
        <button id="drawer-close" class="drawer-close" onclick="toggleAppDrawer(false)" type="button" aria-label="Close drawer">×</button>
    </div>

    <div id="info-panel">
        <div class="info-item"><span class="info-label">Vehicle No:</span> <span id="vehicle-no">TN 13 AE 1950</span></div>
        <div class="info-item"><span class="info-label">Lat/Lng:</span> <span id="coords">13.103869, 80.155762</span></div>
        <div class="info-item"><span class="info-label">Speed:</span> <span id="speed">36 km/h</span></div>
        <div class="info-item"><span class="info-label">Last Update:</span> <span id="last-updated">Aug 20, 2026, 8:44:21 AM</span></div>
    </div>
</aside>

<div id="map-container">
    <div id="map"></div>

    <div class="fab-container">
        <button id="recenter-btn" class="fab active-lock" onclick="toggleRecenterLock()" title="Auto-Center Lock (Click to Center)">🎯</button>
    </div>
</div>

<script>
    const DEFAULT_LAT = 13.120138;
    const DEFAULT_LNG = 80.145874;
    const MAX_PATH_HISTORY = 200; // Limit polyline history cap to prevent browser lag

    // Start with same-origin as a safe default; will be overridden by server-provided apiUrl if available
    let BACKEND_BASE_URL = window.location.origin;

    // Load server-provided api.url (from application.properties) so client honors the server's configured backend URL
    async function loadBackendUrl() {
        try {
            const cfgResp = await fetch(`${window.location.origin}/config`);
            if (cfgResp.ok) {
                const cfg = await cfgResp.json();
                if (cfg && cfg.apiUrl) {
                    BACKEND_BASE_URL = cfg.apiUrl;
                    console.log('Using BACKEND_BASE_URL from server config:', BACKEND_BASE_URL);
                }
            } else {
                console.warn('Unable to fetch /config; using window.location.origin as BACKEND_BASE_URL');
            }
        } catch (e) {
            console.warn('Error fetching /config:', e, '; using window.location.origin');
        }
    }

    // Ensure backend URL is loaded before app config
    // loadAppConfig will be invoked after loadBackendUrl completes in DOMContentLoaded listener

    let map, marker, pathPolyline;
    let isMapLoaded = false;
    let pathHistory = [];
    let currentPos = { lat: DEFAULT_LAT, lng: DEFAULT_LNG };

    let autoCenterLocked = true;
    let countdownInterval = null;
    let secondsRemaining = 10;
    let animationFrameId = null;

    function getFormattedDateTime(rawDateStr) {
        let dateObj = rawDateStr ? new Date(rawDateStr) : new Date();
        if (isNaN(dateObj.getTime())) {
            dateObj = new Date();
        }

        const dateStr = dateObj.toLocaleDateString(undefined, {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
        });

        const timeStr = dateObj.toLocaleTimeString();
        return `${dateStr}, ${timeStr}`;
    }

    async function loadAppConfig(forceRefresh = false) {
        const statusEl = document.getElementById("status");
        const tokenBtn = document.getElementById("refresh-token-btn");

        statusEl.innerText = forceRefresh ? "Refreshing config..." : "Fetching config...";
        statusEl.className = "status-badge";
        if (tokenBtn) tokenBtn.disabled = true;

        try {
            const response = await fetch(`${BACKEND_BASE_URL}/config`);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const cfg = await response.json();
            console.log("Config payload fetched:", cfg);

            // Backend will serve the Google Maps JS (proxy) so the client does not embed the API key
            statusEl.innerText = forceRefresh ? "Config Refreshed!" : "Config Loaded";

            if (!isMapLoaded) {
                loadGoogleMapsScript();
            } else {
                fetchLocation();
            }

        } catch (err) {
            console.error("Config fetch error:", err);
            updateStatusState(`Config Error: ${err.message}`, false);
        } finally {
            if (tokenBtn) tokenBtn.disabled = false;
        }
    }

    function handleRefreshToken() {
        loadAppConfig(true);
    }

    function loadGoogleMapsScript() {
        window.initMap = initMap;
        const script = document.createElement('script');
        // Load Google Maps JS through backend proxy so the API key is not exposed in client HTML
        // Use BACKEND_BASE_URL to ensure the client only calls our backend (or localhost)
        script.src = `${BACKEND_BASE_URL}/maps/js?callback=initMap`;
        script.async = true;
        script.defer = true;
        script.onerror = () => {
            console.error("Failed to load Google Maps SDK");
            updateStatusState("Map SDK Load Error", false);
        };
        document.body.appendChild(script);
    }

    function initMap() {
        isMapLoaded = true;

        const schoolVanIcon = {
            path: 'M 17 2 H 3 C 1.9 2 1 2.9 1 4 v 11 c 0 0.55 0.45 1 1 1 h 1 c 0 1.1 0.9 2 2 2 s 2 -0.9 2 -2 h 6 c 0 1.1 0.9 2 2 2 s 2 -0.9 2 -2 h 1 c 0.55 0 1 -0.45 1 -1 V 8.5 L 17 2 Z M 5 16 c -0.55 0 -1 -0.45 -1 -1 s 0.45 -1 1 -1 s 1 0.45 1 1 s -0.45 1 -1 1 Z m 10 0 c -0.55 0 -1 -0.45 -1 -1 s 0.45 -1 1 -1 s 1 0.45 1 1 s -0.45 1 -1 1 Z M 3 7 h 5 v 3 H 3 V 7 Z m 7 0 h 4.5 l 2 3 H 10 V 7 Z',
            fillColor: '#FFCC00',
            fillOpacity: 1,
            strokeWeight: 1,
            strokeColor: '#000000',
            scale: 1.4,
            anchor: new google.maps.Point(9, 20)
        };

        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 16,
            center: currentPos,
            mapTypeId: "roadmap",
            zoomControl: true,
            zoomControlOptions: {
                position: google.maps.ControlPosition.LEFT_BOTTOM
            },
            streetViewControl: false,
        });

        // Smart Recenter: Pause auto-centering if user drags or pans map manually
        map.addListener('dragstart', () => {
            autoCenterLocked = false;
            document.getElementById("recenter-btn").classList.remove("active-lock");
        });

        marker = new google.maps.Marker({
            position: currentPos,
            map: map,
            icon: schoolVanIcon,
            title: "School Van Location"
        });

        pathPolyline = new google.maps.Polyline({
            path: pathHistory,
            geodesic: true,
            strokeColor: "#1A73E8",
            strokeOpacity: 0.8,
            strokeWeight: 4,
            map: map
        });

        fetchLocation();
        startAutoRefresh();
    }

    async function fetchLocation() {
        const locBtn = document.getElementById("refresh-loc-btn");

        if (locBtn) locBtn.disabled = true;

        const proxyApiUrl = `${BACKEND_BASE_URL}/location`;

        try {
            const response = await fetch(proxyApiUrl);

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const json = await response.json();
            console.log("Location Payload Received:", json);

            const eventData = json?.Result?.Data?.Eventdata || {};
            const deviceData = json?.Result?.Data?.Device || {};

            const lat = parseFloat(eventData.Latitude || json.latitude || json.Lat || DEFAULT_LAT);
            const lng = parseFloat(eventData.Longitude || json.longitude || json.Lng || DEFAULT_LNG);

            const newPos = { lat, lng };

            const rawTimestamp = eventData.Timestamp || json.timestamp || json.GPSTime;
            const formattedTimestamp = getFormattedDateTime(rawTimestamp);

            const rawSpeed = eventData.Speed !== undefined ? parseFloat(eventData.Speed) : 0;
            const speedText = `${rawSpeed} km/h`;

            const vehicleNo = deviceData.VehicleNo || "--";
            document.getElementById("vehicle-no").innerText = vehicleNo;

            updateUI(newPos, formattedTimestamp, speedText);
            updateStatusState("Live", true);

        } catch (error) {
            console.error("GPS API fetch error:", error);
            updateStatusState(`Fetch Error: ${error.message}`, false);
        } finally {
            if (locBtn) locBtn.disabled = false;
            resetCountdown();
        }
    }

    // Smoothly animate marker sliding from startPos to targetPos
    function animateMarker(startPos, targetPos, duration = 1000) {
        if (!marker) return;

        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        const startTime = performance.now();

        function step(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);

            const currentLat = startPos.lat + (targetPos.lat - startPos.lat) * progress;
            const currentLng = startPos.lng + (targetPos.lng - startPos.lng) * progress;

            const interpolatedPos = { lat: currentLat, lng: currentLng };
            marker.setPosition(interpolatedPos);

            if (progress < 1) {
                animationFrameId = requestAnimationFrame(step);
            }
        }

        animationFrameId = requestAnimationFrame(step);
    }

    function updateUI(pos, timestamp, speedText) {
        animateMarker(currentPos, pos);
        currentPos = pos;

        if (map && autoCenterLocked) {
            map.panTo(pos);
        }

        document.getElementById("coords").innerText = `${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}`;
        document.getElementById("last-updated").innerText = timestamp;
        document.getElementById("speed").innerText = speedText;

        // Polyline capped at MAX_PATH_HISTORY entries
        pathHistory.push(pos);
        if (pathHistory.length > MAX_PATH_HISTORY) {
            pathHistory.shift();
        }
        if (pathPolyline) pathPolyline.setPath(pathHistory);
    }

    function updateStatusState(text, isHealthy) {
        const statusEl = document.getElementById("status");
        const dotEl = document.getElementById("pulse-indicator");

        statusEl.innerText = text;
        if (isHealthy) {
            statusEl.className = "status-badge badge-active";
            dotEl.classList.remove("dot-error");
        } else {
            statusEl.className = "status-badge badge-alert";
            dotEl.classList.add("dot-error");
        }
    }

    function toggleAppDrawer(isOpen = null) {
        const drawer = document.getElementById("app-drawer");
        const backdrop = document.getElementById("drawer-backdrop");
        const toggle = document.getElementById("drawer-toggle");
        const nextState = isOpen === null ? !drawer.classList.contains("open") : isOpen;

        drawer.classList.toggle("open", nextState);
        drawer.classList.toggle("closed", !nextState);
        backdrop.classList.toggle("active", nextState);
        if (toggle) {
            toggle.setAttribute("aria-expanded", String(nextState));
        }
    }

    function toggleRecenterLock() {
        autoCenterLocked = true;
        document.getElementById("recenter-btn").classList.add("active-lock");
        if (map) map.panTo(currentPos);
    }

    function toggleAutoRefresh() {
        const isChecked = document.getElementById("auto-refresh-toggle").checked;
        if (isChecked) {
            startAutoRefresh();
        } else {
            stopAutoRefresh();
        }
    }

    function changeInterval() {
        if (document.getElementById("auto-refresh-toggle").checked) {
            startAutoRefresh();
        }
    }

    function startAutoRefresh() {
        stopAutoRefresh();
        const intervalSec = parseInt(document.getElementById("refresh-interval").value, 10);
        secondsRemaining = intervalSec;
        document.getElementById("countdown-timer").innerText = `(${secondsRemaining}s)`;

        countdownInterval = setInterval(() => {
            secondsRemaining--;
            document.getElementById("countdown-timer").innerText = `(${secondsRemaining}s)`;
            if (secondsRemaining <= 0) {
                fetchLocation();
            }
        }, 1000);
    }

    function stopAutoRefresh() {
        clearInterval(countdownInterval);
        document.getElementById("countdown-timer").innerText = "(Off)";
    }

    function resetCountdown() {
        if (document.getElementById("auto-refresh-toggle").checked) {
            secondsRemaining = parseInt(document.getElementById("refresh-interval").value, 10);
            document.getElementById("countdown-timer").innerText = `(${secondsRemaining}s)`;
        }
    }

    // Network status listeners
    window.addEventListener('online', () => {
        document.getElementById("offline-banner").style.display = "none";
        fetchLocation();
    });

    window.addEventListener('offline', () => {
        document.getElementById("offline-banner").style.display = "block";
        updateStatusState("Offline", false);
    });

    window.addEventListener("DOMContentLoaded", async () => {
        await loadBackendUrl();
        loadAppConfig(false);
    });
</script>
</body>
</html>
